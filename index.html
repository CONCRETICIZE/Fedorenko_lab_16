<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf2ed">
    <title>Журнал Git · Степан Федоренко</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <a class="wordmark" href="#top" aria-label="Журнал Git, на главную">SF<span>.</span></a>
        <div class="repo-label"><span class="status-dot"></span> CONCRETICIZE / Fedorenko_lab_16</div>
        <span class="branch-label">main</span>
      </header>

      <section class="intro" id="top" aria-labelledby="page-title">
        <p class="eyebrow">ЛАБОРАТОРНАЯ РАБОТА 16 <span>·</span> 2026</p>
        <h1 id="page-title">История<br><em>изменений.</em></h1>
        <div class="intro-meta">
          <p>Практика Git и GitHub<br>Степан Федоренко</p>
          <div class="progress-box" aria-live="polite">
            <span class="progress-caption">ВЫПОЛНЕНО</span>
            <strong id="progress-count">0 / 9</strong>
            <div class="progress-track" role="progressbar" aria-label="Прогресс лабораторной" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0">
              <span id="progress-fill"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="timeline" aria-labelledby="timeline-title">
        <div class="section-heading">
          <h2 id="timeline-title">Рабочий журнал</h2>
          <span>01 — 09</span>
        </div>

        <div class="stage-list">
          <label class="stage stage-green">
            <input type="checkbox" data-stage="repository" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">01</span>
            <span class="stage-copy"><strong>Репозиторий создан</strong><small>Fedorenko_lab_16 · GitHub</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-coral">
            <input type="checkbox" data-stage="readme" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">02</span>
            <span class="stage-copy"><strong>README обновлён</strong><small>Описание проекта и автора</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-blue">
            <input type="checkbox" data-stage="tag" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">03</span>
            <span class="stage-copy"><strong>Первый коммит помечен</strong><small>Тег lab16-start</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-yellow">
            <input type="checkbox" data-stage="push" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">04</span>
            <span class="stage-copy"><strong>Ветка main опубликована</strong><small>Remote origin подключён</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-green">
            <input type="checkbox" data-stage="project" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">05</span>
            <span class="stage-copy"><strong>Добавлен мини-проект</strong><small>Страница и интерактивный журнал</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-coral">
            <input type="checkbox" data-stage="delete" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">06</span>
            <span class="stage-copy"><strong>Временный файл удалён отдельным коммитом</strong><small>Изменение отражено в истории</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-blue">
            <input type="checkbox" data-stage="edit" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">07</span>
            <span class="stage-copy"><strong>Существующий файл изменён</strong><small>Новый коммит в main</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-yellow">
            <input type="checkbox" data-stage="add" checked>
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">08</span>
            <span class="stage-copy"><strong>Новый файл добавлен</strong><small>Ещё один коммит в истории</small></span>
            <span class="stage-state">ГОТОВО</span>
          </label>
          <label class="stage stage-green">
            <input type="checkbox" data-stage="review">
            <span class="stage-mark" aria-hidden="true"></span>
            <span class="stage-number">09</span>
            <span class="stage-copy"><strong>История проверена на GitHub</strong><small>Коммиты, ветка и тег доступны</small></span>
            <span class="stage-state">В ПЛАНЕ</span>
          </label>
        </div>
      </section>

      <footer class="footer-line">
        <span>СТЕПАН ФЕДОРЕНКО</span>
        <a href="https://github.com/CONCRETICIZE/Fedorenko_lab_16">ОТКРЫТЬ РЕПОЗИТОРИЙ <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </body>
</html>
